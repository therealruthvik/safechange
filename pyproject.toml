[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "safechange"
version = "0.1.0"
description = "AI agent that proposes Kubernetes changes behind policy guardrails, human approval, and rollback readiness checks."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
llm = ["anthropic>=0.60"]
dev = ["pytest>=8.0"]

[project.scripts]
safechange = "safechange.cli:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
safechange = ["default_config.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
